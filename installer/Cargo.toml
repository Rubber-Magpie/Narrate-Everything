[package]
name = "narrate-everything-installer"
version = "1.0.2"
edition = "2021"
description = "Installer for Narrate Everything, the screen reader accessibility mod for Date Everything!"
build = "build.rs"

[[bin]]
name = "NarrateEverythingInstaller"
path = "src/main.rs"

# The installer all Rubber Magpie mods share; this crate is only what's this mod's.
[dependencies]
magpie-installer = { git = "https://github.com/Rubber-Magpie/magpie-installer", branch = "main" }
magpie-payload = { git = "https://github.com/Rubber-Magpie/magpie-installer", branch = "main" }

[build-dependencies]
magpie-payload = { git = "https://github.com/Rubber-Magpie/magpie-installer", branch = "main", features = ["build"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The decompressor gets full speed.
[profile.release.package.lzma-sys]
opt-level = 3
[profile.release.package.xz2]
opt-level = 3
[profile.release.build-override]
opt-level = 3
[profile.dev.build-override]
opt-level = 3
